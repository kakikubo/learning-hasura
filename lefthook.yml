# lefthook.yml
# GitフックをLefthookで管理
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm lint --fix {staged_files}
      stage_fixed: true
    types:
      glob: "*.{ts,tsx}"
      run: pnpm run gen-types
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    test:
      run: pnpm test
    build:
      run: pnpm build

