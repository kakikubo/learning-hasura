# lefthook.yml
# GitフックをLefthookで管理
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    # Biomeでリンティングとフォーマットを実行
    biome-check:
      run: biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      glob: '*.{js,jsx,ts,tsx}'
      stage_fixed: true
    # 代替オプション: Prettierでフォーマット（必要に応じてコメント解除）
