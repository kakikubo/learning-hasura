pre-commit:
  parallel: true
  commands:
    echo-test:
      run: echo "✅ pre-commit hook is working!"
      stage_fixed: false

pre-push:
  parallel: false
  commands:
    echo-push:
      run: echo "✅ pre-push hook is working!"
