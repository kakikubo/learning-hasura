overwrite: true
schema:
  - ${NEXT_PUBLIC_HASURA_URL}:
      headers:
        x-hasura-admin-secret: ${NEXT_PUBLIC_HASURA_KEY}
documents: 'queries/**/*.ts'
generates:
  types/generated/graphql.tsx:
    plugins:
      - 'typescript'
      - 'typescript-operations'
    config:
      strictScalars: true
      scalars:
        timestamptz: string
        uuid: string
