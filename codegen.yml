overwrite: true
schema: "https://kakikubo-hasura.hasura.app/v1/graphql"
documents: "queries/**/*.ts"
generates:
  types/generated/graphql.tsx:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      apolloClientVersion: 4
      gqlImport: "@apollo/client#gql"
      withHooks: true
      withComponent: false
      withHOC: false
      strictScalars: true
      scalars:
        timestamptz: string
        uuid: string
