name: Code Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    name: Biome Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup safe-chain
        run: |
          echo "🔒 Setting up safe-chain..."
          npx @aikidosec/safe-chain setup-ci
          echo "✅ safe-chain setup completed"

      - name: Install dependencies with safe-chain protection
        run: pnpm install --frozen-lockfile

      - name: Run Biome Lint
        run: |
          echo "🔍 Running Biome lint check..."
          pnpm lint:check
          echo "✅ Biome lint check completed successfully"

      - name: TypeScript Type Check
        run: |
          echo "🔍 Running TypeScript type check..."
          npx tsc --noEmit
          echo "✅ TypeScript type check completed successfully"
