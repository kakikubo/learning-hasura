name: Security Check

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  safe-chain:
    name: Supply Chain Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Run safe-chain security check
        run: |
          echo "🔒 Running safe-chain security check..."
          npx @aikidosec/safe-chain
          echo "✅ Security check completed successfully"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
