name: Security Check

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  safe-chain:
    name: Supply Chain Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup safe-chain
        run: |
          echo "🔒 Setting up safe-chain..."
          npx @aikidosec/safe-chain setup-ci
          echo "✅ safe-chain setup completed"

      - name: Install dependencies with safe-chain protection
        run: pnpm install --frozen-lockfile
