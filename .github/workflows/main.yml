name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: learning-hasura-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Dependencies
        run: yarn install
        working-directory: ./kakikubo-hasura
      - name: Run test
        run: yarn test
        working-directory: ./kakikubo-hasura
