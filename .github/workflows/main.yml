name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: learning-hasura-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack and prepare pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm --activate
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: .tool-versions
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run test
        run: pnpm test
