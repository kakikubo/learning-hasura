name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: learning-hasura-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - name: Setup safe-chain
        run: |
          echo "🔒 Setting up safe-chain..."
          npx @aikidosec/safe-chain setup-ci
          echo "✅ safe-chain setup completed"
      - name: Install Dependencies with safe-chain protection
        run: pnpm install --frozen-lockfile
      - name: Run test
        run: pnpm test
